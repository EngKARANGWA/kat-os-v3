{% extends "base.html" %}{% block content %}<h1>Expenses</h1><form class="panel form grid" method="post"><label>Category<select name="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select></label><label>Amount RWF<input type="number" min="0" name="amount" required></label><label>Description<input name="description"></label><button class="btn">Record Expense</button></form><div class="panel"><table><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Recorded by</th></tr>{% for e in expenses %}<tr><td>{{e.created_at.strftime('%d %b %Y %H:%M')}}</td><td>{{e.category}}</td><td>{{e.description}}</td><td>{{"{:,}".format(e.amount)}} RWF</td><td>{{e.created_by}}</td></tr>{% endfor %}</table></div>{% endblock %}
