{% extends "base.html" %}{% block content %}<h1>Staff Users</h1><form class="panel form grid" method="post"><label>Full name<input name="full_name" required></label><label>Username<input name="username" required></label><label>Work email<input type="email" name="work_email" placeholder="name@kat.com"></label><label>Password<input type="password" name="password" required></label><label>Role<select name="role">{% for r in roles %}<option>{{r}}</option>{% endfor %}</select></label><label>Branch<select name="branch_id">{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></label><button class="btn full">Create User</button></form><div class="panel"><table><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Branch</th></tr>{% for u in users %}<tr><td>{{u.full_name}}</td><td>{{u.username}}</td><td>{{u.work_email or "—"}}</td><td>{{u.role}}</td><td>{{u.branch.name if u.branch else "—"}}</td></tr>{% endfor %}</table></div>{% endblock %}
