{% extends "base.html" %}{% block content %}<h1>Audit Log</h1><div class="panel"><table><tr><th>Date</th><th>User</th><th>Action</th><th>Entity</th></tr>{% for l in logs %}<tr><td>{{l.created_at.strftime("%Y-%m-%d %H:%M")}}</td><td>{{l.user_name}}</td><td>{{l.action}}</td><td>{{l.entity}} #{{l.entity_id or ""}}</td></tr>{% endfor %}</table></div>{% endblock %}
