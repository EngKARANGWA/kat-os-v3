{% extends "base.html" %}{% block content %}<h1>New Repair Ticket</h1><form class="panel form grid" method="post"><label>Client<select name="client_id" required><option value="">Choose</option>{% for c in clients %}<option value="{{c.id}}" {% if selected==c.id %}selected{% endif %}>{{c.full_name}} — {{c.phone}}</option>{% endfor %}</select></label><label>Branch<select name="branch_id">{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></label><label>Device<input name="device" placeholder="iPhone 15 Pro Max" required></label><label>IMEI / Serial<input name="serial_imei"></label><label>Device passcode (optional)<input name="device_passcode"></label><label>Accessories received<input name="accessories" placeholder="Case, SIM, charger..."></label><label>Problem category<select name="problem_category">{% for x in terms %}<option>{{x}}</option>{% endfor %}</select></label><label>Technician<select name="technician_id"><option value="">Unassigned</option>{% for t in techs %}<option value="{{t.id}}">{{t.full_name}}</option>{% endfor %}</select></label><label>Quoted price RWF<input type="number" name="quoted_price" min="0"></label><label>Deadline<input type="date" name="deadline"></label><label class="full">Physical condition at intake<textarea name="condition_in" rows="3" placeholder="Cracks, scratches, liquid signs..."></textarea></label><label class="full">Problem notes<textarea name="problem_notes" rows="3"></textarea></label><label class="full">Customer acceptance / typed name<input name="customer_acceptance" placeholder="Customer name confirming intake and applicable T&Cs"></label><button class="btn full">Create Ticket</button></form>{% endblock %}
