{% extends "base.html" %}{% block content %}<h1>Services & Prices</h1><form class="panel inline" method="post"><input name="name" placeholder="Service" required><input type="number" name="price" placeholder="Price"><input type="number" name="warranty_days" value="21" placeholder="Warranty days"><button class="btn">Add</button></form><div class="panel"><table><tr><th>Service</th><th>Price</th><th>Warranty</th></tr>{% for s in services %}<tr><td>{{s.name}}</td><td>{{s.price}} RWF</td><td>{{s.warranty_days}} days</td></tr>{% endfor %}</table></div>{% endblock %}
